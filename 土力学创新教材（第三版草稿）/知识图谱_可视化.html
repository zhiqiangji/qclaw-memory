// 扁平化数据
let nodes = [];
let links = [];
let nodeMap = new Map();
let nodeId = 0;

function processData(parentId, dataObj) {
    const id = nodeId++;
    const node = {
        id: id,
        name: dataObj.name,
        group: dataObj.group,
        description: dataObj.description || "",
        parent: parentId
    };
    nodes.push(node);
    nodeMap.set(dataObj.name, id);
    if (parentId !== null) {
        links.push({
            source: parentId,
            target: id,
            type: "hierarchy"
        });
    }
    if (dataObj.children) {
        dataObj.children.forEach(child => {
            processData(id, child);
        });
    }
    return id;
}

processData(null, data);

// 添加跨章节关联
function addCrossLinks() {
    crossLinks.forEach(cl => {
        // 查找最近的匹配节点
        let sourceId = null;
        let targetId = null;
        for (let [name, id] of nodeMap) {
            if (name.includes(cl.from) && sourceId === null) sourceId = id;
            if (name.includes(cl.to) && targetId === null) targetId = id;
        }
        if (sourceId !== null && targetId !== null) {
            links.push({
                source: sourceId,
                target: targetId,
                type: "cross"
            });
        }
    });
}

let showCrossLinks = true;
addCrossLinks();

// 设置SVG
const svg = d3.select("svg");
const width = window.innerWidth;
const height = window.innerHeight;

svg.attr("width", width).attr("height", height);

const g = svg.append("g");

// 缩放行为
const zoom = d3.zoom()
    .scaleExtent([0.1, 4])
    .on("zoom", (event) => {
        g.attr("transform", event.transform);
    });

svg.call(zoom);

// 初始化位置 - 保证节点都在可视区域
const centerX = width / 2;
const centerY = height / 2;
nodes[0].x = centerX;
nodes[0].y = centerY;

// 让章节环形分布在根节点周围
let chapterNodes = nodes.filter(n => n.group === "chapter");
let chapterCount = chapterNodes.length;
chapterNodes.forEach((node, i) => {
    const angle = (2 * Math.PI * i) / chapterCount;
    node.x = centerX + 220 * Math.cos(angle);
    node.y = centerY + 220 * Math.sin(angle);
});

// 力模拟 - 调整参数让布局更舒展
let simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).distance(d => {
        if (d.type === "cross") return 180;
        const sourceGroup = d.source.group;
        if (sourceGroup === "root") return 220;
        if (sourceGroup === "chapter") return 70;
        return 50;
    }).strength(d => d.type === "cross" ? 0.3 : 0.8))
    .force("charge", d3.forceManyBody().strength(-500))
    .force("center", d3.forceCenter(centerX, centerY))
    .force("collide", d3.forceCollide().radius(d => radiusMap[d.group] + 10))
    .force("x", d3.forceX(centerX).strength(0.08))
    .force("y", d3.forceY(centerY).strength(0.08));

// 绘制连线
const linkGroup = g.append("g");

function updateLinks() {
    linkGroup.selectAll("*").remove();

    // 层级连线
    const hierarchyLinks = linkGroup.selectAll(".link")
        .data(links.filter(d => d.type === "hierarchy"))
        .enter().append("line")
        .attr("class", "link");

    // 跨章节连线
    if (showCrossLinks) {
        const crossLinkList = linkGroup.selectAll(".link-cross")
            .data(links.filter(d => d.type === "cross"))
            .enter().append("line")
            .attr("class", "link-cross");
    }
}

updateLinks();

// 绘制节点
const node = g.append("g")
    .selectAll("g")
    .data(nodes)
    .enter().append("g")
    .attr("class", "node")
    .classed("node--root", d => d.group === "root")
    .classed("node--chapter", d => d.group === "chapter")
    .call(d3.drag()
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended));

node.append("circle")
    .attr("r", d => radiusMap[d.group])
    .style("fill", d => colorMap[d.group]);

// 文本位置调整
node.append("text")
    .attr("dy", d => {
        if (d.group === "root") return 4;
        return radiusMap[d.group] + 14;
    })
    .text(d => d.name);

// 工具提示
const tooltip = d3.select("#tooltip");

node.on("mouseover", function(event, d) {
        tooltip.style("opacity", 1);
        tooltip.html(`
            <h4>${d.name.replace(/\n/g, " ")}</h4>
            <p>${d.description || ""}</p>
        `);
        tooltip.style("left", (event.pageX + 10) + "px")
               .style("top", (event.pageY - 10) + "px");
    })
    .on("mousemove", function(event) {
        tooltip.style("left", (event.pageX + 10) + "px")
               .style("top", (event.pageY - 10) + "px");
    })
    .on("mouseout", function() {
        tooltip.style("opacity", 0);
    })
    .on("click", function(event, d) {
        if (tooltip.style("opacity") === "1" && tooltip.innerHTML.includes(d.description)) {
            tooltip.style("opacity", 0);
        } else {
            tooltip.style("opacity", 1);
            tooltip.html(`
                <h4>${d.name.replace(/\n/g, " ")}</h4>
                <p>${d.description || ""}</p>
            `);
            tooltip.style("left", (event.pageX + 10) + "px")
                   .style("top", (event.pageY - 10) + "px");
        }
    });

simulation.on("tick", () => {
    linkGroup.selectAll("line")
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

    node.attr("transform", d => `translate(${d.x},${d.y})`);
});

function dragstarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
}

function dragged(event, d) {
    d.fx = event.x;
    d.fy = event.y;
}

function dragended(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    // 保持固定位置，方便用户整理
}

let animating = true;
function toggleAnimation() {
    if (animating) {
        simulation.stop();
        animating = false;
    } else {
        simulation.alphaTarget(0.3).restart();
        animating = true;
    }
}

function toggleCrossLinks() {
    showCrossLinks = !showCrossLinks;
    updateLinks();
    simulation.alpha(0.3).restart();
}

function resetZoom() {
    svg.transition()
        .duration(750)
        .call(zoom.transform, d3.zoomIdentity);
    // 释放所有固定节点
    nodes.forEach(d => {
        if (d.group !== "root") {
            d.fx = null;
            d.fy = null;
        }
    });
    simulation.alpha(1).restart();
}

// 窗口大小调整
window.addEventListener('resize', () => {
    const newWidth = window.innerWidth;
    const newHeight = window.innerHeight;
    svg.attr("width", newWidth).attr("height", newHeight);
    simulation.force("center", d3.forceCenter(newWidth / 2, newHeight / 2));
    simulation.alpha(0.3).restart();
});
</script>
</body>
</html>
